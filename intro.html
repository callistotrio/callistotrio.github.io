<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trio Callistó</title>

<!-- FAVICON -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="manifest" href="site.webmanifest">
<link rel="shortcut icon" href="favicon.ico">

<!-- FONT -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=GFS+Didot&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:'GFS Didot', serif;
    background:#f8f6f2;
}

.hero{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
}

/* BACKGROUND IMAGE */

.hero img{

    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center 12%;

    filter:brightness(0.65);

    animation:slowZoom 30s ease-out forwards;

    z-index:1;

}

/* CONTENT */

.content{

    position:absolute;

    width:100%;

    top:68%;

    text-align:center;

    z-index:3;

    animation:fadeUp 1.5s ease forwards;

    opacity:0;

    animation-delay:0.8s;

}

/* GREEK */

.greek{

    font-size:5.5rem;

    opacity:0.20;

    color:white;

    margin-bottom:-3.5rem;

}

/* ENGLISH */

h1{

    color:white;

    font-size:4.1rem;

    font-weight:normal;

}

/* BUTTON */

.enter-button{

    display:inline-block;

    margin-top:2rem;

    padding:12px 32px;

    background:rgba(255,255,255,0.18);

    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);

    color:white;

    text-decoration:none;

    border:1px solid rgba(255,255,255,0.45);

    border-radius:4px;

    box-shadow: 0 8px 24px rgba(0,0,0,0.12);

    font-size:1.05rem;

    transition:.3s;

    opacity:0;

    animation:fadeButton 1.2s ease forwards;

    animation-delay:2.4s;

}

.enter-button:hover{

    background:rgba(255,255,255,0.32);

    border-color:white;

    color:white;

}

/* ANIMATIONS */

@keyframes fadeUp{

    from{

        opacity:0;

        transform:translateY(25px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}

@keyframes fadeButton{

    from{

        opacity:0;

        transform:translateY(20px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}

@keyframes slowZoom{

    from{

        transform:scale(1);

    }

    to{

        transform:scale(1.05);

    }

}
/* MOBILE */

@media (max-width: 768px) {

  .hero img {
    object-position: center top;
  }

  .content {
    top: 51%;
    padding: 0 1.5rem;
  }

  .greek {
    font-size: 3.2rem;
    margin-bottom: -2rem;
  }

  h1 {
    font-size: 2.4rem;
  }

  .enter-button {
    margin-top: 1.5rem;
    font-size: 1rem;
    padding: 12px 28px;
  }

}
</style>

</head>

<body>

<div class="hero">

<picture>

  <!-- Portrait phones & portrait tablets -->
  <source
    media="(orientation: portrait)"
    srcset="TrioMobile.JPG">

  <!-- Everything else (landscape tablets & desktop) -->
  <img src="TrioIntro.JPG" alt="Trio Callistó">

</picture>

<div class="content">

<div class="greek">Τρίο Καλλιστώ</div>

<h1>Trio Callistó</h1>

<a href="home.html" class="enter-button">Enter</a>

</div>

</div>

</body>

</html>
