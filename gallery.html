<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery – Trio Callistó</title>

  <!-- FAVICON -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="icon" href="favicon.ico" sizes="any">

  <!-- GFS Didot -->
  <link href="https://fonts.googleapis.com/css2?family=GFS+Didot&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'GFS Didot', serif;
      margin: 0;
      padding: 2rem;
      background: #f8f6f2;
      color: #1e1e1e;
      text-align: center;
    }

    /* NAVIGATION */
    nav { margin-bottom: 2rem; }
    nav a {
      margin: 0 0.8rem;
      text-decoration: none;
      color: #1e1e1e;
      font-size: 1.1rem;
      position: relative;
      padding-bottom: 3px;
      transition: color 0.2s ease;
    }
    nav a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 0%;
      height: 1px;
      background-color: #8b5e3c;
      transition: width 0.3s ease;
    }
    nav a:hover::after,
    nav a.active::after {
      width: 100%;
    }

    /* DROPDOWN */
    .dropdown { position: relative; display: inline-block; }
    .dropdown-content {
      display: none;
      position: absolute;
      left: 0;
      background-color: #f8f6f2;
      min-width: 160px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      border-radius: 2px;
      z-index: 5;
      text-align: left;
    }
    .dropdown-content a {
      display: block;
      padding: 0.6rem 1rem;
      color: #1e1e1e;
      text-decoration: none;
      font-size: 1rem;
    }
    .dropdown.open .dropdown-content { display: block; }

    /* TITLE */
    .site-title { position: relative; padding-top: 2rem; padding-bottom: 1rem; }
    .site-title h1 { font-size: 2.8rem; margin: 0; }
    .greek-title {
      font-size: 5rem;
      color: rgba(30,30,30,0.06);
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
    }
    @media(max-width:600px){
      .greek-title{font-size:3.5rem;top:-10px;}
      .site-title h1{font-size:2.2rem;}
    }

    /* GALLERY GRID */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
      max-width: 1000px;
      margin: 3rem auto;
    }
    .gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 4px;
      cursor: pointer;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 1s ease, transform 1s ease;
    }
    .gallery img.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* LIGHTBOX OVERLAY */
    .lightbox {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 1rem;
    }

    .lightbox.active { display: flex; }

    .lightbox img {
      max-width: 90%;
      max-height: 85vh;
      border-radius: 6px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    /* ARROWS */
    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 3rem;
      color: white;
      cursor: pointer;
      user-select: none;
      padding: 0.5rem 1rem;
    }
    .arrow:hover { color: #d5c3a3; }

    .arrow.left  { left: 20px; }
    .arrow.right { right: 20px; }

    /* CLOSE BUTTON */
    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 2.5rem;
      color: white;
      cursor: pointer;
      user-select: none;
    }
    .close-btn:hover { color: #d5c3a3; }

    /* FOOTER */
    footer {
      margin-top: 4rem;
      padding-top: 2rem;
      padding-bottom: 2rem;
      font-size: 0.95rem;
      color: #6a6a6a;
      border-top: 1px solid #d4cec6;
    }
  </style>
</head>

<body>

  <!-- TITLE -->
  <div class="site-title">
    <div class="greek-title">Τρίο Καλλιστώ</div>
    <h1>Trio Callistó</h1>
  </div>

  <!-- NAV -->
  <nav>
    <a href="home.html">Home</a>
    <a href="about.html">About</a>
    <a href="gallery.html" class="active">Gallery</a>

    <div class="dropdown">
      <a href="#" id="concerts-toggle">Concerts ▾</a>
      <div class="dropdown-content">
        <a href="concerts-2026-2027.html">2026–2027</a>
        <a href="concerts-2025-2026.html">2025–2026</a>
      </div>
    </div>

    <a href="media.html">Media</a>
    <a href="contact.html">Contact</a>
  </nav>

  <!-- GALLERY GRID -->
  <div class="gallery">
    <img src="Gallery1.JPG" alt="">
    <img src="Gallery2.JPG" alt="">
    <img src="Gallery3.JPG" alt="">
    <img src="Gallery4.JPG" alt="">
    <img src="Gallery5.JPG" alt="">
    <img src="Gallery6.JPG" alt="">
    <img src="Gallery7.JPG" alt="">
    <img src="Gallery8.JPG" alt="">
    <img src="Gallery9.JPG" alt="">
    <img src="Gallery10.JPG" alt="">
    <img src="Gallery11.JPG" alt="">
    <img src="Gallery12.JPG" alt="">
    <img src="Gallery13.JPG" alt="">
  </div>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <span class="close-btn" id="closeBtn">&times;</span>
    <span class="arrow left" id="prevBtn">&#10094;</span>
    <img id="lightbox-img" src="">
    <span class="arrow right" id="nextBtn">&#10095;</span>
  </div>

  <!-- FOOTER -->
  <footer>
    © 2026 Trio Callistó – All Rights Reserved
  </footer>

  <!-- SCRIPT -->
  <script>
    /* Fade-in */
    const images = document.querySelectorAll('.gallery img');
    const observer = new IntersectionObserver(entries=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting) entry.target.classList.add('show');
      });
    },{threshold:0.2});
    images.forEach(img=>observer.observe(img));

    /* Lightbox */
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const closeBtn = document.getElementById('closeBtn');
    const nextBtn = document.getElementById('nextBtn');
    const prevBtn = document.getElementById('prevBtn');

    let currentIndex = 0;

    function openLightbox(index){
      currentIndex = index;
      lightboxImg.src = images[index].src;
      lightbox.classList.add('active');
    }

    function closeLightbox(){
      lightbox.classList.remove('active');
    }

    function showNext(){
      currentIndex = (currentIndex + 1) % images.length;
      lightboxImg.src = images[currentIndex].src;
    }

    function showPrev(){
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      lightboxImg.src = images[currentIndex].src;
    }

    /* Click image → open */
    images.forEach((img, index)=>{
      img.addEventListener('click', ()=> openLightbox(index));
    });

    /* Close */
    closeBtn.addEventListener('click', closeLightbox);

    /* Arrows */
    nextBtn.addEventListener('click', showNext);
    prevBtn.addEventListener('click', showPrev);

    /* Keyboard support */
    document.addEventListener('keydown', e=>{
      if(!lightbox.classList.contains('active')) return;

      if(e.key === 'Escape') closeLightbox();
      if(e.key === 'ArrowRight') showNext();
      if(e.key === 'ArrowLeft') showPrev();
    });

    /* Click outside closes */
    lightbox.addEventListener('click', e=>{
      if(e.target === lightbox) closeLightbox();
    });

    /* Dropdown */
    const toggle=document.getElementById('concerts-toggle');
    const dropdown=toggle.parentElement;
    toggle.addEventListener('click',e=>{
      e.preventDefault();
      dropdown.classList.toggle('open');
    });
    document.addEventListener('click',e=>{
      if(!dropdown.contains(e.target)) dropdown.classList.remove('open');
    });
  </script>

</body>
</html>
