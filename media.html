  <style>

    * {
  box-sizing: border-box;
}
    body {
      font-family: 'GFS Didot', serif;
      margin: 0;
      padding: 2rem;
      background: #f7f3eb;
      color: #1e1e1e;
      text-align: center;
    }

    /* HERO */

.hero {
  position: relative;
  width: calc(100% + 4rem);
  margin-left: -2rem;
  margin-top: -2rem;
  overflow: hidden;
}
    .hero::after {
  content: "";
  display: block;
  height: 2px;
  background: #211e1b;
  margin-top: 4px;
}

.hero picture {
  position: relative;
  display: block;
  width: 100%;
  height: calc(100vh - 140px);
}

.hero picture img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 5%;
  display: block;
}

/* subtle dark overlay */
.hero picture::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.20);
  pointer-events: none;
}

   /* HAMBURGER MENU */

.menu-button {
  position: fixed;
  top: 2rem;
  right: 2rem;
  width: 38px;
  height: 38px;
  padding: 0;
  border: none;
  background: transparent;
  cursor: pointer;
  z-index: 30;
}

.menu-button span {
  display: block;
  width: 28px;
  height: 1px;
  margin: 6px auto;
  background: white;
  transition:
    transform 0.3s ease,
    opacity 0.3s ease,
    background 0.3s ease;
}
    .menu-button.dark span {
  background: #8b5e3c;
}

.menu-button.open span:nth-child(1) {
  transform: translateY(7px) rotate(45deg);
}

.menu-button.open span:nth-child(2) {
  opacity: 0;
}

.menu-button.open span:nth-child(3) {
  transform: translateY(-7px) rotate(-45deg);
}


/* MENU PANEL */

.menu-overlay {
  position: fixed;
  top: 5.8rem;
  right: 2rem;
  width: 175px;

  background: rgba(139, 94, 60, 0.45);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);

  padding: 1.2rem 1.25rem;

  opacity: 0;
  visibility: hidden;
  transform: translateY(-8px);

  transition:
    opacity 0.25s ease,
    transform 0.25s ease,
    visibility 0.25s ease;

  z-index: 25;
}

.menu-overlay.open {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}


/* MENU CONTENT */

.menu-content {
  text-align: left;
}

.menu-content a {
  display: block;
  width: max-content;
  color: white;
  text-decoration: none;
  font-size: 1.15rem;
  margin: 0.8rem 0;
  position: relative;
}

.menu-content a::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -5px;
  width: 0;
  height: 1px;
  background: white;
  transform: translateX(-50%);
  transition: width 0.3s ease;
}

.menu-content a:hover::after,
.menu-content a.active::after {
  width: 100%;
}


/* CONCERT SEASONS */

.menu-concerts-toggle {
  cursor: pointer;
}

.concert-seasons {
  display: none;
  margin: -0.3rem 0 1rem;
}

.concert-seasons.open {
  display: block;
}

.concert-seasons a {
  font-size: 0.95rem;
  margin: 0.55rem 0;
  opacity: 0.8;
}
    /* TITLE */
    .site-title {
  position: absolute;
  top: 3rem;
  left: 0;
  width: 100%;
  margin: 0;
  padding-top: 1.5rem;
  padding-bottom: 1rem;
  text-align: center;
  z-index: 2;
}

.site-title h1 {
  font-size: 3rem;
  margin: -0.4rem 0 0 0;
  font-weight: normal;
  position: relative;
  z-index: 2;
  color: white;
}
   .greek-title {
  position: absolute;
  top: -35px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 5rem;
  color: rgba(255, 255, 255, 0.15);
  white-space: nowrap;
  pointer-events: none;
  z-index: 1;
}
    @media(max-width:600px){
      .greek-title{font-size:3.5rem;top:-10px;}
      .site-title h1{font-size:2.2rem;}
    }

    /* MEDIA TITLE */

.media-intro {
  max-width: 850px;
  margin: 2.5rem auto 1.5rem;
  text-align: center;
}

.media-intro h2 {
  font-size: 4rem;
  font-weight: normal;
  margin: 0;
  letter-spacing: 0.04em;
}

    .media-section-title {
  max-width: 1200px;
  margin: 0 auto 1.5rem;
  text-align: left;
  font-size: 2rem;
  font-weight: normal;
  letter-spacing: 0.04em;
  color: #8b5e3c;

  border-bottom: 1px solid rgba(139, 94, 60, 0.30);
  padding-bottom: 0.6rem;
}
/* GALLERY */

.gallery {
  column-count: 3;
  column-gap: 1.2rem;
  max-width: 1200px;
  margin: 0 auto 3rem;
}

.gallery-item {
  position: relative;
  display: inline-block;
  width: 100%;
  margin-bottom: 1.2rem;
  overflow: hidden;
  border: 1px solid #211e1b;
  cursor: pointer;
  break-inside: avoid;
}

.gallery-item img {
  width: 100%;
  height: auto;
  display: block;
  transition: transform 0.45s ease, filter 0.45s ease;
}

.gallery-item:hover img {
  transform: scale(1.025);
  filter: brightness(0.88);
}

.view-label {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -45%);

  color: rgba(255, 255, 255, 0.75);
  font-family: 'GFS Didot', serif;
  font-size: 0.85rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;

  opacity: 0;
  pointer-events: none;

  transition:
    opacity 0.35s ease,
    transform 0.35s ease;
}

.gallery-item:hover .view-label {
  opacity: 0.75;
  transform: translate(-50%, -50%);
}
    .video-section {
  max-width: 1200px;
  margin: 5rem auto 0;
  text-align: left;
}

.media-divider {
  width: 100%;
  height: 1px;
  background: rgba(33, 30, 27, 0.28);
  margin-bottom: 4rem;
}

.video-section h2 {
  font-size: 2rem;
  font-weight: normal;
  margin: 0 0 2rem;
  letter-spacing: 0.04em;
  color: #8b5e3c;
}
.video-placeholder {
  font-size: 1.1rem;
  color: #6a6a6a;
  margin: 0 0 4rem;
}

/* Tablets */

@media (max-width: 900px) {
  .gallery {
    column-count: 2;
  }
}

/* Phones */

@media (max-width: 600px) {

  .media-intro {
  margin-top: 3rem;
}

.media-intro h2 {
  font-size: 1.7rem;
}

  .gallery {
    column-count: 1;
  }

  .menu-button {
    top: 1.3rem;
    right: 1.3rem;
  }

  .menu-overlay {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100dvh;

    background: rgba(139, 94, 60, 0.45);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 2rem;

    transform: none;
    z-index: 25;
  }

  .menu-overlay.open {
    transform: none;
  }

  .menu-content {
    width: 100%;
    text-align: center;
  }

  .menu-content a {
    font-size: 1.35rem;
    margin: 1rem auto;
  }

  .concert-seasons a {
    font-size: 1rem;
    margin: 0.6rem auto;
  }

  /* white X while full-screen menu is open */
  .menu-button.open span {
    background: white;
  }

}
    /* LIGHTBOX OVERLAY */
    .lightbox {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }

    .lightbox.active { display: flex; }

    .lightbox img {
  max-width: 90%;
  max-height: 85vh;
  border: 1px solid rgba(139, 94, 60, 0.45);
  box-shadow: 0 0 20px rgba(0,0,0,0.4);
}
    .lightbox-counter {
  position: absolute;
  bottom: 3vh;
  left: 50%;
  transform: translateX(-50%);

  font-family: 'GFS Didot', serif;
  font-size: 0.8rem;
  font-style: italic;
  letter-spacing: 0.08em;

  color: rgba(139, 94, 60, 0.60);

  pointer-events: none;
}

    /* ARROWS */
    .arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);

  font-family: 'GFS Didot', serif;
  font-size: 2.4rem;
  font-weight: normal;
  line-height: 1;

  color: rgba(139, 94, 60, 0.60);

  cursor: pointer;
  user-select: none;
  padding: 1rem;

  transition:
    color 0.25s ease,
    transform 0.25s ease;
}

.arrow:hover {
  color: rgba(139, 94, 60, 0.75);
}
    .arrow.left  { left: 20px; }
    .arrow.right { right: 20px; }

    /* CLOSE BUTTON */
    .close-btn {
  position: absolute;
  top: 20px;
  right: 20px;

  font-family: 'GFS Didot', serif;
  font-size: 2rem;
  font-weight: normal;
  line-height: 1;

  color: rgba(139, 94, 60, 0.60);

  cursor: pointer;
  user-select: none;

  transition: color 0.25s ease;
}

.close-btn:hover {
  color: rgba(139, 94, 60, 0.75);
}
    /* FOOTER */
    footer {
      margin-top: 4rem;
      padding-top: 2rem;
      padding-bottom: 2rem;
      font-size: 0.95rem;
      color: #6a6a6a;
      border-top: 1px solid #d4cec6;
    }
  </style>
</head>

<body>

  <!-- GALLERY GRID -->
 <div class="gallery">

  <div class="gallery-item">
    <img src="Gallery6.JPG" alt="">

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <span class="close-btn" id="closeBtn">&times;</span>
    <span class="arrow left" id="prevBtn">←</span>
    
    <img id="lightbox-img" src="">
    <span class="lightbox-counter" id="lightbox-counter"></span>
    
<span class="arrow right" id="nextBtn">→</span>

  <!-- SCRIPT -->
  <script>
   const images = document.querySelectorAll('.gallery img');
const galleryItems = document.querySelectorAll('.gallery-item');
    /* Lightbox */
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const closeBtn = document.getElementById('closeBtn');
    const nextBtn = document.getElementById('nextBtn');
    const prevBtn = document.getElementById('prevBtn');
    const lightboxCounter = document.getElementById('lightbox-counter');

    let currentIndex = 0;

   function openLightbox(index){
  currentIndex = index;
  lightboxImg.src = images[index].src;
  lightboxCounter.textContent = `${currentIndex + 1} / ${images.length}`;
  lightbox.classList.add('active');
}

    function closeLightbox(){
      lightbox.classList.remove('active');
    }

   function showNext(){
  currentIndex = (currentIndex + 1) % images.length;
  lightboxImg.src = images[currentIndex].src;
  lightboxCounter.textContent = `${currentIndex + 1} / ${images.length}`;
}

    function showPrev(){
  currentIndex = (currentIndex - 1 + images.length) % images.length;
  lightboxImg.src = images[currentIndex].src;
  lightboxCounter.textContent = `${currentIndex + 1} / ${images.length}`;
}

    /* Click image → open */
    /* Click gallery item → open */
galleryItems.forEach((item, index)=>{
  item.addEventListener('click', ()=> openLightbox(index));
});

    /* Close */
    closeBtn.addEventListener('click', closeLightbox);

    /* Arrows */
    nextBtn.addEventListener('click', showNext);
    prevBtn.addEventListener('click', showPrev);

    /* Keyboard support */
    document.addEventListener('keydown', e=>{
      if(!lightbox.classList.contains('active')) return;

      if(e.key === 'Escape') closeLightbox();
      if(e.key === 'ArrowRight') showNext();
      if(e.key === 'ArrowLeft') showPrev();
    });

    /* Click outside closes */
    lightbox.addEventListener('click', e=>{
      if(e.target === lightbox) closeLightbox();
    });

    /* HAMBURGER MENU */

const menuButton = document.getElementById('menu-button');
const menuOverlay = document.getElementById('menu-overlay');

const concertsToggle = document.getElementById('concerts-toggle');
const concertSeasons = document.getElementById('concert-seasons');


/* OPEN / CLOSE MAIN MENU */

menuButton.addEventListener('click', () => {
  menuOverlay.classList.toggle('open');
  menuButton.classList.toggle('open');

  if (menuOverlay.classList.contains('open')) {
    menuButton.setAttribute('aria-label', 'Close menu');
  } else {
    menuButton.setAttribute('aria-label', 'Open menu');
    concertSeasons.classList.remove('open');
  }
});


/* CLOSE DESKTOP MENU WHEN MOUSE LEAVES IT */

menuOverlay.addEventListener('mouseleave', () => {
  if (window.innerWidth > 600) {
    menuOverlay.classList.remove('open');
    menuButton.classList.remove('open');
    concertSeasons.classList.remove('open');
    menuButton.setAttribute('aria-label', 'Open menu');
  }
});


/* OPEN / CLOSE CONCERT SEASONS */

concertsToggle.addEventListener('click', (e) => {
  e.preventDefault();
  concertSeasons.classList.toggle('open');
});


/* CLOSE MENU WHEN A PAGE LINK IS SELECTED */

const menuLinks = menuOverlay.querySelectorAll(
  'a:not(#concerts-toggle)'
);

menuLinks.forEach(link => {
  link.addEventListener('click', () => {
    menuOverlay.classList.remove('open');
    menuButton.classList.remove('open');
  });
});
    /* CHANGE HAMBURGER COLOUR BELOW HERO */

const hero = document.querySelector('.hero');

function updateMenuButtonColour() {
  const heroBottom = hero.getBoundingClientRect().bottom;
  const buttonMiddle = menuButton.getBoundingClientRect().top + 19;

  if (buttonMiddle > heroBottom) {
    menuButton.classList.add('dark');
  } else {
    menuButton.classList.remove('dark');
  }
}

window.addEventListener('scroll', updateMenuButtonColour);
window.addEventListener('resize', updateMenuButtonColour);
updateMenuButtonColour();
  </script>
